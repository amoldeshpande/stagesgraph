plugins { id 'com.android.application' }
android {
    namespace 'com.stagesgraphs'
    compileSdk 28
    signingConfigs {
        debug { storeFile file("$rootDir/.tools/android-home/debug.keystore") }
    }
    defaultConfig {
        applicationId 'com.stagesgraphs'
        minSdk 22
        targetSdk 22
        versionCode 4
        versionName '1.3'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
